name: mqttbenchmark-brokers

x-broker-defaults: &broker-defaults
  restart: unless-stopped
  mem_limit: 4g
  cpuset: "0"
  network_mode: host
  labels:
    mqttbenchmark.broker: "true"
  logging:
    driver: local
    options:
      max-size: 1m
      max-file: "3"

services:
  aedes:
    <<: *broker-defaults
    profiles: [aedes]
    build:
      context: .
      dockerfile: Dockerfile.aedes
    image: ${AEDES_IMAGE:?Resolve Aedes image identity before starting the stand.}
    container_name: aedes

  mosquitto:
    <<: *broker-defaults
    profiles: [mosquitto]
    image: ${MOSQUITTO_IMAGE:?Resolve Mosquitto image identity before starting the stand.}
    container_name: mosquitto
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    tmpfs: [/mosquitto/data]

  activemq:
    <<: *broker-defaults
    profiles: [activemq]
    build:
      context: .
      dockerfile: activemq/Dockerfile
    image: ${ACTIVEMQ_IMAGE:?Resolve ActiveMQ image identity before starting the stand.}
    container_name: activemq
    volumes:
      - ./activemq/activemq.xml:/opt/activemq/conf/activemq.xml:ro
    tmpfs: [/opt/activemq/data]

  emqx:
    <<: *broker-defaults
    profiles: [emqx]
    image: ${EMQX_IMAGE:?Resolve EMQX image identity before starting the stand.}
    container_name: emqx
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    tmpfs: [/opt/emqx/data]
