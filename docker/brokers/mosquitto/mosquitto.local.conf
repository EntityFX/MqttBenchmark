# Mosquitto для локального (без контейнера) стенда MqttBenchmark.
# Совпадает по смыслу с контейнерным mosquitto.conf (docker/brokers/mosquitto/mosquitto.conf).
#
# log_dest stdout, а не log_file: в Mosquitto 2.x опция log_file удалена, а синтаксис
# `log_dest file` требует имени файла аргументом. Логи пишутся в stdout, куда контроллер
# перенаправляет поток при запуске нативного брокера (broker.stdout.log), поэтому версия
# брокера не влияет на конфигурацию.
listener 1883 127.0.0.1
allow_anonymous true
persistence false
autosave_interval 0
log_dest stdout
log_type warning
log_type error
connection_messages false

# $SYS публикуется раз в sys_interval секунд (по умолчанию 10). Окно ожидания в preflight
# тоже 10 с, поэтому версия брокера попадала в отчёт только при везении. Явный интервал 2 с
# делает $SYS/broker/version детерминированно доступным в пределах окна.
sys_interval 2