# Mosquitto для локального (без контейнера) стенда MqttBenchmark.
# Совпадает по смыслу с контейнерным mosquitto.conf: слушает MQTT-порт,
# анонимный доступ, без персистентности.
# log_file — относительно: контроллер ставит WorkingDirectory в каталог логов
# попытки (кроссплатформенно), при ручном запуске — в текущий каталог.
listener 1883 127.0.0.1
allow_anonymous true
persistence false
autosave_interval 0
log_dest file
log_file mosquitto.log
log_type warning
log_type error
connection_messages false