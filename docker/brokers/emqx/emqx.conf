node {
  name = "emqx@${CONTROL_INTERFACE}"
  dist_bind_address = "${CONTROL_INTERFACE}"
  cookie = "mqttbenchmark-isolated-stand"
  data_dir = "/opt/emqx/data"
}

cluster.discovery_strategy = manual
rpc.listen_address = "${CONTROL_INTERFACE}"

listeners.tcp.default {
  bind = "0.0.0.0:${MQTT_PORT}"
}

dashboard.listeners.http.bind = "${CONTROL_INTERFACE}:18083"
listeners.ssl.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false

durable_sessions.enable = false
log.console.level = warning
log.file.enable = false
