name: dissertation-broker-matrix

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      campaign:
        description: Optional immutable campaign id
        required: false
        type: string

permissions:
  contents: read

jobs:
  full-matrix:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MqttY provenance source
        uses: actions/checkout@v4
        with:
          repository: EntityFX/mqtty
          path: mqtty
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Build and test pipeline
        shell: pwsh
        run: |
          dotnet test src/EntityFX.MqttBenchmark.sln --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run and aggregate complete matrix
        id: campaign
        shell: pwsh
        run: |
          $campaign = "${{ inputs.campaign }}"
          if ([string]::IsNullOrWhiteSpace($campaign)) {
            $campaign = [DateTimeOffset]::UtcNow.ToString("yyyyMMdd-HHmmssZ")
          }
          ./scripts/RunDissertationMatrix.ps1 `
            -Campaign $campaign `
            -MqttYRepository (Join-Path $PWD "mqtty")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "campaign=$campaign" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-calibration-${{ steps.campaign.outputs.campaign }}
          path: |
            results/raw/${{ steps.campaign.outputs.campaign }}/
            results/aggregated/${{ steps.campaign.outputs.campaign }}/
          retention-days: 90
